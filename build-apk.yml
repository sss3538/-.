# Автосборка Android-приложения «Конвертер валют».
# Положи в репозиторий файл App.jsx (код приложения) и этот файл по пути .github/workflows/build-apk.yml.
# После каждого изменения GitHub сам соберёт APK и выложит его в раздел Releases.

name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Создать проект приложения
        run: |
          JSX_FILE="$(ls *.jsx 2>/dev/null | head -n 1)"
          if [ -z "$JSX_FILE" ]; then
            echo "Не найден файл с кодом приложения (.jsx) в корне репозитория"
            exit 1
          fi
          mkdir -p app/src
          cp "$JSX_FILE" app/src/App.jsx
          cd app

          cat > package.json <<'EOF'
          {
            "name": "currency-converter",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "build": "vite build"
            }
          }
          EOF

          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import tailwindcss from '@tailwindcss/vite';

          export default defineConfig({
            base: './',
            plugins: [react(), tailwindcss()]
          });
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
              <meta name="theme-color" content="#F4F5F7" />
              <title>Конвертер валют</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat > src/main.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import App from './App.jsx';
          import './index.css';

          createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          EOF

          cat > src/index.css <<'EOF'
          @import "tailwindcss";
          @custom-variant dark (&:where(.dark, .dark *));

          html, body {
            margin: 0;
            background: #F4F5F7;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.konverter.valut",
            "appName": "Конвертер валют",
            "webDir": "dist",
            "android": {
              "adjustMarginsForEdgeToEdge": "force"
            }
          }
          EOF

      - name: Установить библиотеки
        working-directory: app
        run: |
          npm install react@18 react-dom@18 lucide-react @capacitor/core@7 @capacitor/android@7
          npm install -D vite@6 @vitejs/plugin-react@4 tailwindcss@4 @tailwindcss/vite@4 @capacitor/cli@7

      - name: Собрать веб-часть
        working-directory: app
        run: npm run build

      - name: Создать Android-проект
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Собрать APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Подготовить файл
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Konverter-valut.apk

      - name: Сохранить APK в сборке
        uses: actions/upload-artifact@v4
        with:
          name: Konverter-valut-apk
          path: Konverter-valut.apk

      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Конвертер валют — сборка ${{ github.run_number }}
          body: Скачай файл Konverter-valut.apk на телефон и открой его, чтобы установить.
          files: Konverter-valut.apk
